<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triagem - HospRAP</title>
    <link rel="stylesheet" href="triagem.css">
</head>
<body>
    <div class="container">
        <div class="nav">
            <a href="index.html">← Início</a> | <a href="teste.html">Cadastro</a> | <a href="atendimento.html">Atendimento Médico</a>
        </div>
        <h2>🩺 Triagem do Paciente</h2>

        <div class="dados-paciente" id="dadosPaciente">
            <p><strong>Paciente:</strong> <span id="pNome">-</span></p>
            <p><strong>CPF:</strong> <span id="pCpf">-</span> &nbsp;|&nbsp; <strong>Nascimento:</strong> <span id="pData">-</span></p>
            <p><strong>Telefone:</strong> <span id="pTel">-</span> &nbsp;|&nbsp; <strong>E-mail:</strong> <span id="pEmail">-</span></p>
        </div>

        <form id="formTriagem" onsubmit="enviarTriagem(event)">
            <label>Queixa Principal</label>
            <input type="text" id="queixa" placeholder="Ex: Dor de cabeça intensa, febre..." required>

            <div class="row">
                <div class="field">
                    <label>Pressão Arterial (mmHg)</label>
                    <input type="text" id="pa" placeholder="120/80" required>
                </div>
                <div class="field">
                    <label>Frequência Cardíaca (bpm)</label>
                    <input type="number" id="fc" placeholder="75" required>
                </div>
                <div class="field">
                    <label>Temperatura (°C)</label>
                    <input type="number" step="0.1" id="temp" placeholder="36.5" required>
                </div>
            </div>

            <div class="row">
                <div class="field">
                    <label>Saturação O₂ (%)</label>
                    <input type="number" id="spo2" placeholder="98" required>
                </div>
                <div class="field">
                    <label>Peso (kg)</label>
                    <input type="number" step="0.1" id="peso" placeholder="70.5" required>
                </div>
                <div class="field">
                    <label>Altura (m)</label>
                    <input type="number" step="0.01" id="altura" placeholder="1.75" required>
                </div>
            </div>

            <div class="row">
                <div class="field">
                    <label>Nível de Dor (0 a 10)</label>
                    <input type="range" id="dor" min="0" max="10" value="0" oninput="document.getElementById('dorValor').innerText = this.value">
                    <div style="text-align:center; color:#4facfe; font-weight:bold;"><span id="dorValor">0</span>/10</div>
                </div>
                <div class="field">
                    <label>Classificação de Risco</label>
                    <select id="risco" required>
                        <option value="">Selecione...</option>
                        <option value="Emergência">🔴 Emergência</option>
                        <option value="Muito Urgente">🟠 Muito Urgente</option>
                        <option value="Urgente">🟡 Urgente</option>
                        <option value="Pouco Urgente">🟢 Pouco Urgente</option>
                        <option value="Não Urgente">🔵 Não Urgente</option>
                    </select>
                </div>
            </div>

            <label>Alergias / Observações</label>
            <textarea id="obs" placeholder="Alergias medicamentosas, doenças prévias, observações importantes..."></textarea>

            <button type="submit" id="btnEnviar">Salvar Triagem</button>
            <button type="button" class="secondary" onclick="window.location.href='atendimento.html'">Ir para Atendimento Médico</button>
        </form>

        <div id="mensagemSucesso" class="mensagem">
            ✅ Triagem registrada com sucesso!
        </div>
    </div>

    <script src="triagem.js"></script>
</body>
</html>
