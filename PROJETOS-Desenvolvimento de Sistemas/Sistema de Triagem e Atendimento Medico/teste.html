<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - HospRAP</title>
    <link rel="stylesheet" href="teste.css">
</head>
<body>
    <div class="container">
        <div class="nav">
            <a href="index.html">← Início</a> | <a href="triagem.html">Triagem</a> | <a href="atendimento.html">Atendimento Médico</a>
        </div>

        <!-- TELA DE FORMULÁRIO -->
        <div id="telaCadastro">
            <h2>📝 Cadastro de Paciente</h2>
            <form id="formCadastro">
                <label for="nome">Nome completo</label>
                <input type="text" id="nome" placeholder="Nome completo" required>

                <label for="data">Data de nascimento</label>
                <input type="date" id="data" required>

                <label for="cpf">CPF</label>
                <input type="text" id="cpf" placeholder="CPF (000.000.000-00)" required>

                <label for="tel">Telefone</label>
                <input type="tel" id="tel" placeholder="Telefone" required>

                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="E-mail" required>

                <button type="submit" id="btnEnviar">Cadastrar Paciente</button>
            </form>
        </div>

        <!-- APENAS A MENSAGEM DE SUCESSO -->
        <div id="mensagemSucesso" class="mensagem">
            ✅ Cadastro realizado com sucesso!
        </div>
    </div>

    <script src="teste.js"></script>
</body>
</html>
